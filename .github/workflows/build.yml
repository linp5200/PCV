name: 编译 PCV（Flutter）

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.9'
          channel: 'stable'
          cache: true

      - name: 获取依赖
        run: flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 提取版本号（pubspec）
        id: version
        run: |
          VERSION=$(grep -oP '^version:\s*\K[^+\s]+' pubspec.yaml)
          BUILD=$(grep -oP '^version:\s*[^+]+\+\K\d+' pubspec.yaml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "APP_BUILD=$BUILD" >> $GITHUB_ENV
          echo "版本: $VERSION+$BUILD"

      - name: 编译 Release APK（ABI 拆分 + 通用包）
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release
          mkdir -p /tmp/release
          V=$(grep -oP '^version:\s*\K[^+\s]+' pubspec.yaml)
          cd build/app/outputs/flutter-apk
          [ -f app-arm64-v8a-release.apk ] && cp app-arm64-v8a-release.apk "/tmp/release/PCV_android_v${V}_arm64-v8a.apk"
          [ -f app-armeabi-v7a-release.apk ] && cp app-armeabi-v7a-release.apk "/tmp/release/PCV_android_v${V}_armeabi-v7a.apk"
          [ -f app-x86_64-release.apk ] && cp app-x86_64-release.apk "/tmp/release/PCV_android_v${V}_x86_64.apk"
          cp app-release.apk "/tmp/release/PCV_android_v${V}_all.apk"
          ls -la /tmp/release/

      - name: 发布到 GitHub Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          files: /tmp/release/*.apk
          name: PCV 代码工作台 ${{ env.VERSION }}
          tag_name: v${{ env.VERSION }}
          generate_release_notes: false
          update_release: true
          overwrite_files: true

      - uses: actions/upload-artifact@v4
        with:
          name: pcv-release
          path: /tmp/release/PCV_android_v*_all.apk
